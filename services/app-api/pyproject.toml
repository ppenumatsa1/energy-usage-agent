[project]
name = "energy-usage-app-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-projects>=2.0.0b1",
    "azure-identity>=1.17",
    "energy-usage-shared",
    "httpx>=0.27",
    "mcp>=1.30,<2",
    "msal>=1.30",
    "openai>=1.80",
    "opentelemetry-api>=1.27",
    "psycopg[binary,pool]>=3.2",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_usage_app_api"]

[tool.uv.sources]
energy-usage-shared = { workspace = true }
