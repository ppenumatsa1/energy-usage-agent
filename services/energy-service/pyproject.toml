[project]
name = "energy-usage-energy-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.17",
    "energy-usage-shared",
    "mcp>=1.30,<2",
    "psycopg[binary,pool]>=3.2",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_usage_energy"]

[tool.uv.sources]
energy-usage-shared = { workspace = true }
