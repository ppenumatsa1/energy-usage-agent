# Foundry PROMPT agent definition. Deployed by scripts/deploy_agent.py (azd postdeploy hook).
# The agent only *requests* tools; app-api executes them against the energy-service with the user's token.
name: energy-usage-agent
description: Answers questions about the signed-in customer's energy usage.
model: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}   # resolved from the azd environment at deploy time; reasoning model, so no temperature
instructions: instructions.md
tools: tools/                              # generated by scripts/sync_tool_specs.py; do not edit by hand
response_format:
  name: energy_answer
  schema: output-schema.json
  strict: true
