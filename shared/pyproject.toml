[project]
name = "energy-usage-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",  # async transport for azure.identity.aio / azure.ai.projects.aio
    "azure-identity>=1.17",
    "azure-monitor-opentelemetry>=1.6",
    "fastapi>=0.142",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_usage_shared"]
